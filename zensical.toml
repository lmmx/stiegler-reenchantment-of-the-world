  { "concepts/proletarianization.md" = "Proletarianization as the loss of knowledge by producers, consumers and knowledge workers." },
  { "concepts/short-termism.md" = "Short-termism as the temporal form of drive-based behaviour in finance, media and politics." },
  { "concepts/spirit.md" = "Spirit (esprit) and Valéry's \"value of spirit\", the book's measure of what consumer capitalism lowers." },
  { "concepts/symbolic-misery.md" = "Symbolic misery: the loss of individuation that follows from losing a part in producing symbols." },
  { "concepts/technologies-of-spirit.md" = "Technologies of spirit, and the contrast between psychotechnologies and nootechnologies." },
  { "concepts/tertiary-retention.md" = "Tertiary retention: memory held outside the living being in artefacts, after Husserl's primary and secondary retention." },
