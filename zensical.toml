[project]
site_name = "The Re-Enchantment of the World"
site_description = "A study companion to Bernard Stiegler and Ars Industrialis, The Re-Enchantment of the World (2006; English 2014): layered summaries, concepts and evaluated sources."
site_author = "Louis Maddox"
site_url = "https://lmmx.github.io/stiegler-reenchantment-of-the-world/"
repo_name = "lmmx/stiegler-reenchantment-of-the-world"
repo_url = "https://github.com/lmmx/stiegler-reenchantment-of-the-world"
edit_uri = "edit/master/"
copyright = "A fair-use study companion: summaries and short attributed quotations only. The book is © Bernard Stiegler, Ars Industrialis and Bloomsbury."

# The repository root is the docs directory, so every page keeps its path (and its relative
# links) on GitHub and on the site. Pages link to each other with relative .md links, which
# work in both places. A new page needs a nav entry and a front-matter description, listed
# with that same description in the llmstxt sections below (website/check_site.py).
# Left out: the site's own templates and scripts (website/), and the build output.
docs_dir = "."
exclude_docs = """
/website/overrides/
/website/*.py
/site/
/Justfile
/zensical.toml
"""

# The site's own stylesheet carries ?v=dev, which the site workflow replaces with the commit
# it builds, so a browser fetches each deploy's copy and not a cached one.
extra_css = ["website/assets/extra.css?v=dev"]

